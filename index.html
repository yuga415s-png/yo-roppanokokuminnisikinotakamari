    <style>

        .wall-left, .wall-right {

            position: absolute; top: 0; left: 20%; width: 60%; height: 100%;

        .hit-flash { animation: hitAnimation 0.35s ease-out; }
        @keyframes hitAnimation {
            0% { filter: brightness(4) sepia(1) hue-rotate(120deg) saturate(5); transform: translateX(-50%) scale(1.15) rotate(3deg); }
            50% { filter: brightness(0.2); transform: translateX(-50%) scale(0.9) rotate(-3deg); }

        .monster-status {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 75%;
            background: rgba(10, 10, 15, 0.9); padding: 6px 12px; border-radius: 12px; border: 1px solid #ffd700; z-index: 3;

        .monster-name { font-weight: bold; font-size: 13px; color: #ffd700; margin-bottom: 4px; }
        .hp-bar-bg { background: #2a2a35; height: 10px; border-radius: 5px; border: 1px solid #555; overflow: hidden; }
        .hp-bar-fill { background: linear-gradient(90deg, #ff4757, #ff6b81); height: 100%; width: 100%; transition: width 0.4s ease-out; }

        .question-text { font-size: 15px; font-weight: bold; margin-bottom: 12px; line-height: 1.4; color: #fff; }
        .options { display: grid; grid-template-columns: 1fr; gap: 8px; }
        
        .btn {
            background: linear-gradient(180deg, #3a4b7c, #243054); color: white; border: 1px solid #4f649e;

        .get-item-btn { background: #e67e22; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .clear-screen { display: none; padding: 10px 0; }
        .action-btn {

            font-size: 14px; border-radius: 8px; cursor: pointer; margin: 10px 5px 0 5px; font-weight: bold;
        }
    </style>
</head>

<script>
// ==================== Web Audio API サウンド ====================
let audioCtx = null;
let soundEnabled = true;
let bgmInterval = null;

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById("soundStatus").innerText = soundEnabled ? "ON" : "OFF";
    if (!soundEnabled) stopBGM();
    else playBGM('select');
}

function playSE(type) {
    if (!soundEnabled) return;
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'miss') {
        osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'chest') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(1046, now + 0.15);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'clear') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.connect(g); g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(freq, now + idx * 0.12);
            g.gain.setValueAtTime(0.2, now + idx * 0.12);
            g.gain.linearRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
            o.start(now + idx * 0.12); o.stop(now + idx * 0.12 + 0.3);
        });
    }
}

function stopBGM() {
    if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
}

function playBGM(mode) {
    if (!soundEnabled) return;
    initAudio(); stopBGM();
    let step = 0; let notes = []; let speed = 250;

    // ヨーロッパの荘厳さを意識したBGM
    if (mode === 'select') { notes = [329, 392, 493, 392]; speed = 260; }
    else if (mode === 1) { notes = [220, 261, 329, 261, 220, 196]; speed = 220; }
    else if (mode === 2) { notes = [164, 196, 220, 246, 220, 196]; speed = 190; }
    else if (mode === 3) { notes = [146, 174, 220, 174, 146, 130]; speed = 160; }

    bgmInterval = setInterval(() => {
        if (!soundEnabled) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = (mode === 'select') ? 'triangle' : 'sawtooth';
        osc.frequency.setValueAtTime(notes[step % notes.length], now);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.linearRampToValueAtTime(0.001, now + (speed / 1000) * 0.8);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + (speed / 1000) * 0.8);
        step++;
    }, speed);
}

// ==================== モンスターSVG（ヨーロッパ風デザイン） ====================
const monsterSVGs = [
    // ステージ1: ナポレオン3世風モンスター
    'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><defs><linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%231e3c72"/><stop offset="100%" stop-color="%232a5298"/></linearGradient></defs><circle cx="80" cy="80" r="70" fill="rgba(0,100,255,0.15)"/><path d="M30 50 L130 50 L110 120 L50 120 Z" fill="url(%23g1)" stroke="%23d4af37" stroke-width="3"/><path d="M20 50 L80 15 L140 50 Z" fill="%23111" stroke="%23d4af37" stroke-width="2"/><circle cx="60" cy="75" r="7" fill="%2300ffff"/><circle cx="100" cy="75" r="7" fill="%2300ffff"/><rect x="65" y="95" width="30" height="8" fill="%23d4af37"/><path d="M50 120 L80 145 L110 120" stroke="%23ff0055" stroke-width="4" fill="none"/></svg>',
    // ステージ2: ビスマルク風モンスター（鉄血）
    'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><defs><linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="%23434343"/><stop offset="100%" stop-color="%23000000"/></linearGradient></defs><circle cx="80" cy="80" r="75" fill="rgba(255,255,255,0.1)"/><path d="M40 40 L120 40 L130 130 L30 130 Z" fill="url(%23g2)" stroke="%23999" stroke-width="3"/><path d="M50 40 L80 10 L110 40 Z" fill="%23d4af37"/><circle cx="80" cy="22" r="5" fill="%23fff"/><circle cx="60" cy="70" r="8" fill="%23ff0000"/><circle cx="100" cy="70" r="8" fill="%23ff0000"/><rect x="50" y="95" width="60" height="10" fill="%23333" stroke="%23777" stroke-width="2"/></svg>',
    // ステージ3: ロンドン万博ゴーレム（結晶・産業）
    'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><defs><linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="%2300b4db"/><stop offset="100%" stop-color="%230083b0"/></linearGradient></defs><circle cx="80" cy="80" r="75" fill="rgba(0,255,200,0.15)"/><polygon points="80,15 135,50 120,130 40,130 25,50" fill="url(%23g3)" stroke="%23fff" stroke-width="3"/><line x1="25" y1="50" x2="135" y2="50" stroke="%23fff" stroke-width="2"/><line x1="80" y1="15" x2="80" y2="130" stroke="%23fff" stroke-width="2"/><circle cx="60" cy="75" r="10" fill="%23ffea00"/><circle cx="100" cy="75" r="10" fill="%23ffea00"/><polygon points="80,90 65,115 95,115" fill="%23fff"/></svg>'
];

const monsterNames = ["帝国の亡霊 ナポレオン3世", "鉄血宰相 ビスマルク", "大英帝国の巨魁 万国博覧会ゴーレム"];
const levelBadges = ["ステージ 1：基礎知識", "ステージ 2：標準問題", "ステージ 3：発展問題"];

// ==================== 問題データ（各ステージ10問：計30問） ====================
const questionsByLevel = {
    // ステージ1：基礎問題（語句・人物・出来事）
    1: [
        { q: "19世紀にフランス革命の理念により生まれ、言語や歴史などを共有する人々の意識を何という？", options: ["国民（国民意識）", "領主", "農奴", "貴族"], ans: 0, exp: "身分や地域の違いをこえて「国民」としてまとまる意識（ナショナリズム）が高まりました。", hint: "「国」の「民」としての意識です。" },
        { q: "1851年に世界で初めて万国博覧会が開催された、首都ロンドンを擁する国は？", options: ["イギリス", "フランス", "ドイツ", "ロシア"], ans: 0, exp: "世界最大の都市ロンドンで第1回万国博覧会が開かれ、「世界の工場」としての技術力を示しました。", hint: "産業革命を最初に達成した島国です。" },
        { q: "1852年にフランスで皇帝となり、積極的な外交を行った人物（ナポレオンの甥）は？", options: ["ナポレオン3世", "ナポレオン1世", "ルイ16世", "ビスマルク"], ans: 0, exp: "フランスの第二帝政を確立したナポレオン3世です。", hint: "ナポレオンの「3世」です。" },
        { q: "「鉄血宰相」と呼ばれ、富国強兵を進めてドイツ統一を達成したプロイセンの宰相は？", options: ["ビスマルク", "カヴール", "メッテルニヒ", "ディズレーリ"], ans: 0, exp: "「鉄と血（兵力と軍備）」によってドイツ統一を進めました。", hint: "「ビス〇〇ク」という名前です。" },

// ==================== ゲーム状態変数 ====================
let userProgress = JSON.parse(localStorage.getItem('dungeon_progress_euro_v1')) || { 1: 0, 2: 0, 3: 0 };
let currentStage = 1;
let currentQ = 0;
let correctAnswersCount = 0;
let streakCount = 0;

let items = { twoOpts: 0, hint: 0 };

// ==================== 画面遷移・処理 ====================
function updateSelectScreenUI() {
    for (let i = 1; i <= 3; i++) {
        const card = document.getElementById(`card${i}`);
        const badge = document.getElementById(`badge${i}`);
        const isUnlocked = (i === 1) || (userProgress[i - 1] > 0);

        if (isUnlocked) {
            card.classList.remove('locked');
            badge.innerText = (userProgress[i] > 0) ? "★" : "☆";
        } else {
            card.classList.add('locked');
            badge.innerText = "🔒";
        }
    }
    let total = 0;
    for (let i = 1; i <= 3; i++) if (userProgress[i] > 0) total++;
    document.getElementById("totalStars").innerText = "★".repeat(total) + "☆".repeat(3 - total);
}

function startSelectedStage(stageNum) {
    const isUnlocked = (stageNum === 1) || (userProgress[stageNum - 1] > 0);
    if (!isUnlocked) { alert("前のステージをクリアすると解放されます！"); return; }

    currentStage = stageNum;
    currentQ = 0;
    correctAnswersCount = 0;
    streakCount = 0;

    document.getElementById("selectScreen").style.display = "none";
    document.getElementById("clearArea").style.display = "none";
    document.getElementById("gameArea").style.display = "block";

    updateItemUI();
    playBGM(currentStage);
    loadQuestion();
}

function goToSelect() {
    updateSelectScreenUI();
    document.getElementById("gameArea").style.display = "none";
    document.getElementById("clearArea").style.display = "none";
    document.getElementById("selectScreen").style.display = "block";
    playBGM('select');
}

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function updateItemUI() {
    document.getElementById("countTwoOpts").innerText = items.twoOpts;
    document.getElementById("countHint").innerText = items.hint;
    document.getElementById("itemTwoOptsBtn").disabled = (items.twoOpts <= 0);
    document.getElementById("itemHintBtn").disabled = (items.hint <= 0);
    document.getElementById("streakNum").innerText = streakCount;
}

function loadQuestion() {
    const qData = questionsByLevel[currentStage][currentQ];
    
    document.getElementById("immediateExp").style.display = "none";
    document.getElementById("qText").innerText = `${currentQ + 1}. ${qData.q}`;
    
    const idx = currentStage - 1;
    document.getElementById("monsterImg").src = monsterSVGs[idx];
    document.getElementById("monsterName").innerText = monsterNames[idx];
    document.getElementById("levelBadge").innerText = levelBadges[idx];

    const totalQ = questionsByLevel[currentStage].length;
    const remainingHpPercent = ((totalQ - correctAnswersCount) / totalQ) * 100;
    document.getElementById("hpFill").style.width = remainingHpPercent + "%";

    const container = document.getElementById("optionBtns");
    container.innerHTML = "";
    
    const shuffledOptions = shuffleArray(qData.options);
    shuffledOptions.forEach((optText) => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = optText;
        btn.onclick = () => checkAnswer(optText, qData.options[qData.ans], qData);
        container.appendChild(btn);
    });

    updateItemUI();
}

function checkAnswer(selectedText, correctText, qData) {
    const btns = document.querySelectorAll(".btn");
    btns.forEach(b => b.disabled = true);

    const monsterImg = document.getElementById("monsterImg");
    const slashEffect = document.getElementById("slashEffect");
    const expBox = document.getElementById("immediateExp");
    const expTitle = document.getElementById("expTitle");
    const expBody = document.getElementById("expBody");

    let isCorrect = (selectedText === correctText);

    if (isCorrect) {
        correctAnswersCount++;
        streakCount++;
        playSE('hit');

        slashEffect.classList.remove("slash-active"); void slashEffect.offsetWidth;
        slashEffect.classList.add("slash-active");

        monsterImg.classList.remove("hit-flash"); void monsterImg.offsetWidth;
        monsterImg.classList.add("hit-flash");

        const totalQ = questionsByLevel[currentStage].length;
        document.getElementById("hpFill").style.width = (((totalQ - correctAnswersCount) / totalQ) * 100) + "%";

        expTitle.innerHTML = "<span style='color:#2ed573;'>⚔️ 正解！</span>";
    } else {
        streakCount = 0;
        playSE('miss');
        expTitle.innerHTML = `<span style='color:#ff4757;'>❌ 不正解... (正解: ${correctText})</span>`;
    }

    expBody.innerText = qData.exp;
    expBox.style.display = "block";

    updateItemUI();

    if (isCorrect && streakCount > 0 && streakCount % 2 === 0) {
        setTimeout(() => { showChestModal(); }, 600);
    }
}

function showChestModal() {
    playSE('chest');
    document.getElementById("chestIcon").innerText = "📦";
    document.getElementById("chestMsg").innerText = `${streakCount}連続正解！宝箱を発見！`;
    document.getElementById("openChestBtn").style.display = "inline-block";
    document.getElementById("chestModal").style.display = "flex";
}

function openTreasureChest() {
    const gotItem = (Math.random() < 0.5) ? 'twoOpts' : 'hint';
    if (gotItem === 'twoOpts') {
        items.twoOpts++;
        document.getElementById("chestIcon").innerText = "✂️";
        document.getElementById("chestMsg").innerText = "「2択にする」アイテムをゲット！";
    } else {
        items.hint++;
        document.getElementById("chestIcon").innerText = "💡";
        document.getElementById("chestMsg").innerText = "「ヒント」アイテムをゲット！";
    }
    document.getElementById("openChestBtn").style.display = "none";
    updateItemUI();

    setTimeout(() => {
        document.getElementById("chestModal").style.display = "none";
    }, 1200);
}

function useItemTwoOpts() {
    if (items.twoOpts <= 0) return;
    items.twoOpts--;
    updateItemUI();

    const qData = questionsByLevel[currentStage][currentQ];
    const correctText = qData.options[qData.ans];
    const btns = Array.from(document.querySelectorAll(".btn"));

    let removed = 0;
    btns.forEach(btn => {
        if (btn.innerText !== correctText && removed < 2) {
            btn.style.visibility = "hidden";
            removed++;
        }
    });
}

function useItemHint() {
    if (items.hint <= 0) return;
    items.hint--;
    updateItemUI();

    const qData = questionsByLevel[currentStage][currentQ];
    alert(`💡 ヒント: ${qData.hint}`);
}

function nextQuestion() {
    currentQ++;
    const totalQ = questionsByLevel[currentStage].length;

    if (currentQ < totalQ) {
        loadQuestion();
    } else {
        finishStage();
    }
}

function finishStage() {
    stopBGM();
    playSE('clear');

    document.getElementById("gameArea").style.display = "none";
    document.getElementById("clearArea").style.display = "block";

    const totalQ = questionsByLevel[currentStage].length;
    const isPassed = correctAnswersCount >= 7;

    const clearTitle = document.getElementById("clearTitle");
    const resultMsg = document.getElementById("resultMessage");
    const nextBtn = document.getElementById("nextBtn");

    if (isPassed) {
        userProgress[currentStage] = Math.max(userProgress[currentStage], correctAnswersCount);
        localStorage.setItem('dungeon_progress_euro_v1', JSON.stringify(userProgress));

        clearTitle.innerText = "🎉 ステージクリア！ 🎉";
        resultMsg.innerHTML = `正解数: <strong>${correctAnswersCount} / ${totalQ}</strong><br>見事に敵を撃破し、歴史の知識をマスターしました！`;
        
        if (currentStage < 3) {
            nextBtn.style.display = "inline-block";
            nextBtn.innerText = "次のステージへ";
        } else {
            nextBtn.style.display = "none";
        }
    } else {
        clearTitle.innerText = "💀 討伐失敗... 💀";
        resultMsg.innerHTML = `正解数: <strong>${correctAnswersCount} / ${totalQ}</strong><br>クリアには7問以上の正解が必要です。もう一度挑戦しよう！`;
        nextBtn.style.display = "inline-block";
        nextBtn.innerText = "もう一度挑戦する";
    }
}

function nextStageAction() {
    const totalQ = questionsByLevel[currentStage].length;
    if (correctAnswersCount >= 7 && currentStage < 3) {
        startSelectedStage(currentStage + 1);
    } else {
        startSelectedStage(currentStage);
    }
}

// 初期化実行
updateSelectScreenUI();
</script>
